# Cap container logs (json-file default is unlimited → grows forever).
# Applied per service below; takes effect when a container is (re)created on deploy.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

services:
  app:
    container_name: award-system-frontend-app
    image: ghcr.io/zentrixlab/energenius-award-system-frontend:latest
    restart: unless-stopped
    logging: *default-logging
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      NEXT_PUBLIC_NEXUS_API_URL: ${NEXT_PUBLIC_NEXUS_API_URL}
      NEXT_PUBLIC_API_KEY: ${NEXT_PUBLIC_API_KEY}
      CORE_API_URL: ${CORE_API_URL}
      NEXUS_API_URL: ${NEXUS_API_URL}
      ADMIN_PREVIEW_MODE: "false"
      NEXT_PUBLIC_ADMIN_PREVIEW_MODE: "false"
    networks:
      - default
      - shared-proxy

networks:
  shared-proxy:
    external: true
