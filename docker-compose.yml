services:
  backend:
    build:
      context: ./core
      dockerfile: Dockerfile
    image: energenius-wallet-backend
    depends_on:
      - db
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      DATABASE_NAME: energenius
      DATABASE_URL: postgresql://postgres:postgres@db:5432/postgres?schema=public
      API_KEY: zentrix-lab-energenius-wallet
    # No direct port exposure - nginx will proxy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: energenius-wallet-frontend
    depends_on:
      - backend
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: https://energenius-wallet.zentrix.io/v1
      NEXT_PUBLIC_API_KEY: zentrix-lab-energenius-wallet
    # No direct port exposure - nginx will proxy

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    restart: unless-stopped

  certbot:
    image: certbot/certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

